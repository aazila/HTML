<html>
<head>
    <title>CSS Example</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Inline CSS -->
    <h1 style="background-color: yellow;">
        Welcome to My Web Page
    </h1>

    <p>This paragraph uses internal CSS.</p>

    <h2>About CSS</h2>

    <p>CSS is used to style HTML webpages.</p>

</body>
</html>
